[project]
name = "ha-github-copilot"
version = "0.4.0"
description = "Home Assistant conversation agent and AI Tasks backed by the GitHub Copilot SDK"
requires-python = ">=3.14.2"
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.optional-dependencies]
dev = [
    "homeassistant>=2026.10.0,<2026.12.0",
    "github-copilot-sdk==1.0.31",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
