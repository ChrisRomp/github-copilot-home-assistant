name: Validate integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        homeassistant: ["2026.10.0", "2026.11.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Check integration version and SDK pin consistency
        run: |
          python - <<'PY'
          import json
          import pathlib
          import tomllib
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]
          manifest = json.loads(
              pathlib.Path("custom_components/github_copilot/manifest.json").read_text()
          )
          assert project["version"] == manifest["version"], "Integration versions differ"
          sdk = [
              requirement
              for requirement in project["optional-dependencies"]["dev"]
              if requirement.startswith("github-copilot-sdk==")
          ]
          assert sdk == manifest["requirements"], "SDK pins differ"
          PY
      - run: python -m pip install -e '.[dev]' 'homeassistant==${{ matrix.homeassistant }}'
      - name: Install HA conversation and AI Task contract requirements
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys
          import homeassistant
          components = pathlib.Path(homeassistant.__file__).parent / "components"
          requirements = sorted({
              requirement
              for name in ("conversation", "camera", "image", "stream")
              for requirement in json.loads(
                  (components / name / "manifest.json").read_text()
              ).get("requirements", [])
          })
          subprocess.run([sys.executable, "-m", "pip", "install", *requirements], check=True)
          PY
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
        env:
          HA_COPILOT_HA_TESTS: "1"
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          comment: "false"
